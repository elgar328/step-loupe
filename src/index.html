<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<!-- Tint the mobile browser chrome (address/status bar) to match the dark 3D view
     that sits at the top of the page on small screens. -->
<meta name="theme-color" content="#1e1e1e" />
<title>step-loupe — STEP viewer</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.20.1/cdn/themes/light.css" />
<style>
  * { box-sizing: border-box; }
  /* Dark page backdrop: fills overscroll gutters and gives iOS Safari a dark
     surface to tint the toolbar from (paired with the theme-color meta). */
  html, body { margin: 0; height: 100%; font: 13px/1.4 system-ui, sans-serif; background: #1e1e1e; }
  #app { display: flex; height: 100vh; height: 100dvh; }
  #side {
    width: 340px; min-width: 240px; max-width: 60vw;
    display: flex; flex-direction: column;
    background: #fafafa;   /* light/dark contrast defines the edge; no border line */
  }
  #side-scroll { flex: 1 1 auto; overflow: auto; padding: 0 8px 8px; }
  /* pinned detail (inspector) pane at the bottom of the sidebar */
  #detail {
    flex: none; max-height: 42%; overflow: auto;
    border-top: 1px solid #10131a; padding: 6px 8px 8px;
    background: #22272e; color: #d0d5da;   /* dark inspector, echoes the 3D view */
  }
  #view { flex: 1; position: relative; overflow: hidden; }
  #view canvas { display: block; width: 100% !important; height: 100% !important; }
  #drop {
    position: absolute; inset: 0; display: flex; align-items: center;
    justify-content: center; color: #888; pointer-events: none;
    font-size: 15px; text-align: center;
  }
  pre { white-space: pre-wrap; word-break: break-all; margin: 4px 0; font-size: 11px; color: #333; }
  .drop-hi { outline: 3px dashed #4a90e2; outline-offset: -6px; }
  /* up-axis menu: one quiet button in the view's corner says which axis is up, and
     opens the choice below it. Button and menu sit on one plate whose edge is lighter
     than the view's #1e1e1e, so it reads as a control rather than a hole in the scene. */
  #up {
    position: absolute; top: 8px; right: 8px;
    display: flex; flex-direction: column; align-items: flex-end; gap: 4px;
  }
  #up[hidden], #up-menu[hidden] { display: none; }   /* display:flex would beat [hidden] */
  #up-btn, #up-menu { background: #2a2d33; border: 1px solid #4b5059; border-radius: 6px; }
  #up-btn {
    font: 600 12px system-ui, sans-serif; color: #b8bec7;
    padding: 5px 10px; cursor: pointer;
  }
  #up-btn:hover, #up-btn[aria-expanded="true"] { color: #fff; }
  #up-menu { display: flex; flex-direction: column; padding: 4px; }
  #up-menu button {
    font: 12px system-ui, sans-serif; color: #b8bec7; background: none; border: 0;
    border-radius: 4px; padding: 5px 10px; text-align: left; cursor: pointer; white-space: nowrap;
  }
  #up-menu button:hover { background: #3a3e46; color: #fff; }
  /* The chosen axis: a check and full-strength text, no fill. */
  #up-menu button::before { content: '\2713'; display: inline-block; width: 1.3em; visibility: hidden; }
  #up-menu button[aria-checked="true"] { color: #fff; }
  #up-menu button[aria-checked="true"]::before { visibility: visible; }

  /* file control */
  #filebar { display: flex; align-items: center; gap: 8px; flex: none; padding: 8px 8px 6px; }
  #openbtn { flex: none; }               /* never shrink or wrap the button */
  #fname {
    flex: 1 1 auto; min-width: 0;         /* take remaining width, allow shrink */
    font-size: 11.5px; color: #6b7280;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }

  /* ---- tree (native <details>/<summary>) — one design language for scene +
     report + header. Typography scale is fixed via variables. ---- */
  :root {
    --fs-row: 12.5px;    /* node label */
    --fs-meta: 11px;     /* key/value meta lines */
    --fs-group: 11.5px;  /* uppercase group headers */
    --fs-id: 11px;       /* entity #id tag */
    --indent: 14px;      /* per-depth indentation + chevron slot width */
    --row-hover: #eef2f7;
    --row-sel: #dbeafe;
  }
  details { margin: 0; }
  summary { list-style: none; }
  summary::-webkit-details-marker { display: none; }

  /* a single row (summary for parents, div for leaves) */
  .row {
    display: flex; align-items: flex-start; gap: 0;
    padding: 2px 4px; border-radius: 4px; cursor: pointer;
    font-size: var(--fs-row); line-height: 1.45; color: #24292f;
    user-select: none;
  }
  .row:hover { background: var(--row-hover); }
  .row.sel { background: var(--row-sel); }
  /* read-only info rows (report/header) don't act selectable */
  .row.info { cursor: default; }
  .row.info:hover { background: var(--row-hover); }  /* still give hover feedback */

  /* chevron: a CSS triangle in a fixed-width slot; leaves reserve the slot */
  .chev {
    flex: none; width: var(--indent); height: calc(var(--fs-row) * 1.45);
    display: inline-flex; align-items: center; justify-content: center;
    color: #8a9099; transition: transform .12s ease;
  }
  .chev::before { content: ''; border: 4px solid transparent; border-left-color: currentColor; border-right: 0; margin-left: 1px; }
  details[open] > summary > .chev { transform: rotate(90deg); }
  .chev.leaf::before { content: none; }  /* leaves: empty slot, keeps alignment */

  /* the stacked content: title line + meta lines */
  .node-content { display: flex; flex-direction: column; min-width: 0; flex: 1; }
  .node-title { display: flex; align-items: center; min-width: 0; }
  /* a tall thin color bar (not a square) — same kinds stacked read as one
     continuous vertical band, broken only between rows; sits near the label. */
  .dot {
    flex: none; display: inline-block;
    width: 3px; height: calc(var(--fs-row) * 1.3); border-radius: 1px;
    margin: 0 5px 0 3px; background: #b0b6bd;
  }
  .label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .idtag { color: #9aa0a6; font-size: var(--fs-id); margin-left: 6px; font-variant-numeric: tabular-nums; }
  .metaline { font-size: var(--fs-meta); line-height: 1.4; }
  .mk { color: #8b949e; margin-right: 4px; }
  .mv { color: #24292f; word-break: break-word; }
  .mv.empty { color: #b0b6bd; }

  /* group header rows (canonical top-level categories) */
  .row.group > .node-content > .node-title > .label {
    font-weight: 600; text-transform: uppercase; letter-spacing: .03em;
    font-size: var(--fs-group); color: #57606a;
  }
  .row.group .dot { display: none; }
  .row.group.empty { cursor: default; }
  .row.group.empty > .node-content > .node-title > .label { color: #b0b6bd; }
  .none { color: #b0b6bd; font-size: 10.5px; margin-left: 6px; }

  /* report/header structural rows: bold root, muted sub-group */
  .row.meta-root > .node-content > .node-title > .label { font-weight: 600; }
  .row.meta-sub > .node-content > .node-title > .label { color: #6b7280; font-size: 12px; }
  .row.meta-sub.empty { cursor: default; }
  .row.meta-sub.empty > .node-content > .node-title > .label { color: #b0b6bd; }
  .row.meta-root .dot, .row.meta-sub .dot, .row.kv .dot { display: none; }

  /* per-kind dot palette (type legend) */
  .k-Feature .dot { background: #d29922; }
  .k-Part .dot { background: #8957e5; }
  .k-Component .dot { background: #bf3989; }
  .k-Solid .dot { background: #e5534b; }
  .k-Face .dot { background: #c9992a; }
  .k-Bound .dot { background: #8250df; }
  .k-Edge .dot { background: #2188ff; }
  .k-Vertex .dot { background: #1a7f37; }
  .k-Product .dot { background: #bf3989; }
  .k-Dimension .dot { background: #0969da; }
  .k-Tolerance .dot { background: #bc4c00; }
  .k-Datum .dot { background: #159588; }
  .k-Mesh .dot { background: #57606a; }

  /* ---- detail (inspector) pane ---- */
  .detail-title {
    display: flex; align-items: center; gap: 6px; margin-bottom: 4px;
    font-size: var(--fs-row); font-weight: 600; color: #e6edf3;
  }
  .detail-title .kind { font-weight: 400; color: #909aa4; font-size: var(--fs-id); }
  .detail-title .idtag { margin-left: auto; color: #7d8590; }
  .detail-empty { color: #7d8590; font-size: var(--fs-meta); font-style: italic; padding: 4px 0; }
  .detail-row { display: flex; gap: 6px; font-size: var(--fs-meta); line-height: 1.5; }
  .detail-row .mk { flex: none; min-width: 84px; color: #909aa4; }
  .detail-row .mv { color: #d0d5da; word-break: break-word; }
  .detail-row .mv.empty { color: #6b7280; }
  .swatch {
    display: inline-block; width: 10px; height: 10px; border-radius: 2px;
    border: 1px solid #ffffff33; margin-right: 4px; vertical-align: -1px;
  }

  /* ---- mobile: stack the 3D view over the panel (top/bottom split) ---- */
  @media (max-width: 640px) {
    #app { flex-direction: column; }
    #view { order: -1; flex: none; height: 50dvh; }   /* 3D on top, ~half the screen */
    #side { width: 100%; min-width: 0; max-width: none; flex: 1 1 auto; min-height: 0; }
    #side-scroll { min-height: 0; overscroll-behavior: contain; } /* scroll in-panel, no page bleed */
    #detail { max-height: 40%; }                        /* inspector share of the bottom half */
    .row { padding: 5px 4px; }                          /* larger touch targets */
    #up-btn { min-height: 44px; min-width: 48px; font-size: 14px; }
    #up-menu button { min-height: 44px; font-size: 14px; }
  }
</style>
</head>
<body>
<div id="app">
  <div id="side">
    <div id="filebar">
      <input type="file" id="file" accept=".step,.stp" hidden />
      <sl-button id="openbtn" size="small" variant="primary">Open STEP file</sl-button>
      <span id="fname">No file loaded</span>
    </div>
    <div id="side-scroll">
      <div id="report"></div>
      <div id="header"></div>
      <div id="units"></div>
      <div id="tree"></div>
    </div>
    <div id="detail"><div class="detail-empty">Select an item to see details</div></div>
  </div>
  <div id="view">
    <div id="drop">Drop a STEP file here</div>
    <div id="up" hidden>
      <button type="button" id="up-btn" title="Up axis" aria-haspopup="menu" aria-expanded="false">Y↑</button>
      <div id="up-menu" role="menu" hidden>
        <button type="button" role="menuitemradio" data-up="y" aria-checked="true">Y axis up</button>
        <button type="button" role="menuitemradio" data-up="z" aria-checked="false">Z axis up</button>
      </div>
    </div>
  </div>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
}}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { LineSegments2 } from 'three/addons/lines/LineSegments2.js';
import { LineSegmentsGeometry } from 'three/addons/lines/LineSegmentsGeometry.js';
import { LineMaterial } from 'three/addons/lines/LineMaterial.js';
import 'https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.20.1/cdn/components/button/button.js';

// ---- reader (step-io in wasm, in a Worker) ----
// The wasm-bindgen glue (no-modules build) and the wasm, from ./pkg; the
// single-file bundle inlines both in place of these two lines.
const glueSrc = await (await fetch('./pkg/step_loupe.js')).text();
const wasmBytes = new Uint8Array(await (await fetch('./pkg/step_loupe_bg.wasm')).arrayBuffer());
// Compiled once; each read instantiates it in a Worker of its own, ended when
// the read answers, so the memory the read took goes back with it. A classic
// Worker: a module Worker from a blob: URL is refused when the page is opened
// from file:// (the downloaded bundle). The Worker reads the file itself, a block
// at a time, and hands the reader the pieces it asks for, so the reader never
// holds the whole file. From file:// the page reads it instead and hands the
// bytes over, which the Worker then gives out the same way.
const wasmModule = await WebAssembly.compile(wasmBytes);
const readerUrl = URL.createObjectURL(new Blob([glueSrc, `
const BLOCK = 8 << 20; // bytes per FileReaderSync call
self.onmessage = (e) => {
  try {
    wasm_bindgen.initSync({ module: e.data.module });
    const file = e.data.file, reader = file && new FileReaderSync();
    let at = 0, block = e.data.bytes || new Uint8Array(0), used = 0;
    const source = {
      readInto(buf) {
        try {
          if (used === block.length) {
            if (!file) return 0;
            if (at >= file.size) {
              // A file gone since it was picked reads as empty; reading it
              // whole is what reports that.
              if (at === 0) reader.readAsArrayBuffer(file);
              return 0;
            }
            const end = Math.min(at + BLOCK, file.size);
            block = new Uint8Array(reader.readAsArrayBuffer(file.slice(at, end)));
            used = 0;
            at = end;
          }
          const n = Math.min(buf.length, block.length - used);
          buf.set(block.subarray(used, used + n));
          used += n;
          return n;
        } catch (err) {
          throw String(err); // the reader reports it as text
        }
      },
    };
    // The reader hands its result over as it makes it: the JSON in pieces and
    // the geometry in runs of [rows, d, tri], each copied out of wasm memory.
    const decoder = new TextDecoder(), text = [], geom = [];
    const sink = {
      text(bytes) { text.push(decoder.decode(bytes)); },
      geometry(rows, d, tri) { geom.push([rows.slice(), d.slice(), tri.slice()]); },
    };
    wasm_bindgen.load_step(source, sink);
    self.postMessage({ json: text.join(''), geom }, geom.flat().map((a) => a.buffer));
  } catch (err) {
    self.postMessage({ error: String(err) });
  }
};`], { type: 'text/javascript' }));

// What readStep resolves to when a newer read took its place.
const CANCELLED = Symbol('cancelled');
let reading = null; // the running read: { worker, resolve }

// Read a STEP file (a Blob) into what the viewer shows: { json, geom }, the JSON
// bundle as text and the geometry runs. Starting a read cancels the one still
// running. The Worker gets the Blob itself, not a copy of its bytes, except
// from file://, where it gets the bytes the page read.
function readStep(file) {
  if (reading) {
    reading.worker.terminate();
    reading.resolve(CANCELLED);
  }
  return new Promise((resolve, reject) => {
    const worker = new Worker(readerUrl);
    const me = { worker, resolve };
    reading = me;
    const settle = (fn) => {
      if (reading !== me) return; // cancelled: whatever it sends is stale
      reading = null;
      worker.terminate();
      fn();
    };
    worker.onmessage = (e) => settle(() =>
      e.data.error ? reject(new Error(e.data.error)) : resolve(e.data));
    worker.onerror = (e) => { e.preventDefault(); settle(() => reject(new Error(e.message || 'the reader stopped'))); };
    worker.onmessageerror = () => settle(() => reject(new Error('the read result could not be received')));
    if (location.protocol !== 'file:') {
      worker.postMessage({ module: wasmModule, file });
      return;
    }
    // Safari will not let a Worker read a picked file when the page is opened
    // from file://.
    file.arrayBuffer().then(
      (buf) => {
        if (reading === me) worker.postMessage({ module: wasmModule, bytes: new Uint8Array(buf) }, [buf]);
      },
      (err) => settle(() =>
        resolve({ json: JSON.stringify({ ok: false, error: `could not read the file: ${err}` }), geom: [] })),
    );
  });
}

// ---- three.js scene ----
const view = document.getElementById('view');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(devicePixelRatio);
view.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1e1e1e);
const camera = new THREE.PerspectiveCamera(50, 1, 0.001, 1e7);
camera.position.set(1, 1, 1);
// Rebuilt by setUp(): OrbitControls fixes its orbit axis from camera.up when it is
// constructed, so changing camera.up alone would leave every later drag on the old axis.
let controls = new OrbitControls(camera, renderer.domElement);
let root = new THREE.Group();
scene.add(root);

function resize() {
  const w = view.clientWidth, h = view.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h; camera.updateProjectionMatrix();
  const buf = renderer.getDrawingBufferSize(new THREE.Vector2());
  for (const m of [M.faint, M.hiLine, M.fallback]) m.resolution.copy(buf);
}
window.addEventListener('resize', resize);
(function loop() { requestAnimationFrame(loop); controls.update(); renderer.render(scene, camera); })();

// ---- materials ----
const M = {
  // Pushed back a little so a highlighted copy drawn over an edge, at the same
  // depth, always wins; vertices and highlights keep their true depth.
  faint: new LineMaterial({ color: 0xbbbbbb, linewidth: 2, polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1 }),
  hiLine: new LineMaterial({ color: 0x00ffff, linewidth: 5 }),
  fallback: new LineMaterial({ color: 0xff4444, linewidth: 3, dashed: true, dashSize: 0.5, gapSize: 0.3 }),
  pt: new THREE.PointsMaterial({ color: 0x888888, size: 4, sizeAttenuation: false }),
  hiPt: new THREE.PointsMaterial({ color: 0xffcc00, size: 10, sizeAttenuation: false }),
  mesh: new THREE.MeshNormalMaterial({ transparent: true, opacity: 0.4, side: THREE.DoubleSide }),
  hiMesh: new THREE.MeshBasicMaterial({ color: 0x00ffff, transparent: true, opacity: 0.6, side: THREE.DoubleSide }),
};
resize(); // now that M exists, size renderer + line-material resolution
// Opaque draw order, the one three.js gave one object per edge/vertex (it orders
// ties by material): edges, highlighted edges, fallback edges, vertices,
// highlighted vertices — vertex dots stay visible on highlighted edges.
const ORDER = { faint: 0, hiLine: 1, fallback: 2, pt: 3, hiPt: 4 };

// ---- state ----
let HLMAP = {};         // node id -> extra render ids to highlight (features/PMI)
// Render id -> where it is drawn. All edges share one line object and all
// vertices one points object, so a frame is a few draw calls however large the
// file: an edge is a run of segments ({ start, count }, in segments), a vertex
// one point ({ start }), a mesh its own object ({ obj }).
let ranges = new Map();
let edgeSegs = new Float32Array(0);  // merged edge segments, 6 floats each
let vertexPts = new Float32Array(0); // merged vertex points, 3 floats each
// The highlight: copies of the selected edges/vertices drawn over the base,
// and the meshes switched to the highlight material.
let hiNode = null, hiObjs = [], hiMeshes = [];

function clearScene() {
  scene.remove(root);
  root.traverse(o => { o.geometry?.dispose(); });
  root = new THREE.Group(); scene.add(root);
  ranges.clear();
  edgeSegs = new Float32Array(0); vertexPts = new Float32Array(0);
  hiNode = null; hiObjs = []; hiMeshes = [];
}

// A polyline's points as segment pairs, written into `out` from segment `at`.
function putSegments(out, at, d) {
  const n = d.length / 3 - 1;
  for (let i = 0; i < n; i++) {
    const o = (at + i) * 6, k = i * 3;
    for (let c = 0; c < 6; c++) out[o + c] = d[k + c];
  }
}

// Kinds of geometry the reader sends; a fallback is a straight segment
// standing in for an edge whose curve could not be sampled.
const KIND = { line: 0, fallback: 1, point: 2, mesh: 3 };

// The reader's geometry comes in runs of [rows, d, tri], in node id order: each
// item is four numbers in `rows` (node id, kind, its floats in `d`, its indices
// in `tri`). Calls fn(id, kind, d, tri) for each item, with views of its values.
function eachGeom(geom, fn) {
  for (const [rows, d, tri] of geom) {
    let at = 0, ti = 0;
    for (let r = 0; r < rows.length; r += 4) {
      const nd = rows[r + 2], nt = rows[r + 3];
      fn(rows[r], rows[r + 1], d.subarray(at, at + nd), tri.subarray(ti, ti + nt));
      at += nd; ti += nt;
    }
  }
}

function buildObjects(geom) {
  const box = new THREE.Box3();
  const points = [];   // every drawn position, for the camera fit
  const segCount = d => Math.max(0, d.length / 3 - 1);
  let nSeg = 0, nFall = 0, nPt = 0;
  eachGeom(geom, (id, kind, d) => {
    if (kind === KIND.line) nSeg += segCount(d);
    else if (kind === KIND.fallback) nFall += segCount(d);
    else if (kind === KIND.point) nPt++;
  });
  const segs = new Float32Array(nSeg * 6), fall = new Float32Array(nFall * 6);
  const fallDist = new Float32Array(nFall * 2), pts = new Float32Array(nPt * 3);
  let s = 0, f = 0, p = 0;
  eachGeom(geom, (id, kind, d, tri) => {
    if (kind === KIND.line || kind === KIND.fallback) {
      const n = segCount(d);
      if (kind === KIND.fallback) {
        // Dash distances restart at each edge, as LineSegments2.computeLineDistances
        // does for one edge.
        putSegments(fall, f, d);
        for (let i = 0; i < n; i++) {
          const o = (f + i) * 6, j = (f + i) * 2;
          const dx = fall[o + 3] - fall[o], dy = fall[o + 4] - fall[o + 1], dz = fall[o + 5] - fall[o + 2];
          fallDist[j] = i === 0 ? 0 : fallDist[j - 1];
          fallDist[j + 1] = fallDist[j] + Math.sqrt(dx * dx + dy * dy + dz * dz);
        }
        ranges.set(id, { type: 'line', fallback: true });
        f += n;
      } else {
        putSegments(segs, s, d);
        ranges.set(id, { type: 'line', start: s, count: n });
        s += n;
      }
    } else if (kind === KIND.point) {
      pts.set(d, p * 3);
      ranges.set(id, { type: 'point', start: p });
      p++;
    } else if (kind === KIND.mesh) {
      // Meshes stay one object each: they are see-through, and three.js sorts
      // see-through objects far to near, which a merged mesh would lose.
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.BufferAttribute(d, 3));
      points.push(d);
      if (tri.length) geo.setIndex(new THREE.BufferAttribute(tri, 1));
      geo.computeVertexNormals();
      const obj = new THREE.Mesh(geo, M.mesh);
      geo.computeBoundingBox();
      box.union(geo.boundingBox);
      root.add(obj);
      ranges.set(id, { type: 'mesh', obj });
    }
  });
  const add = (obj, order) => {
    obj.renderOrder = order;
    obj.geometry.computeBoundingBox();
    box.union(obj.geometry.boundingBox);
    root.add(obj);
  };
  if (nSeg) {
    const geo = new LineSegmentsGeometry();
    geo.setPositions(segs);
    add(new LineSegments2(geo, M.faint), ORDER.faint);
  }
  if (nFall) {
    const geo = new LineSegmentsGeometry();
    geo.setPositions(fall);
    const dist = new THREE.InstancedInterleavedBuffer(fallDist, 2, 1);
    geo.setAttribute('instanceDistanceStart', new THREE.InterleavedBufferAttribute(dist, 1, 0));
    geo.setAttribute('instanceDistanceEnd', new THREE.InterleavedBufferAttribute(dist, 1, 1));
    add(new LineSegments2(geo, M.fallback), ORDER.fallback);
  }
  if (nPt) {
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(pts, 3));
    add(new THREE.Points(geo, M.pt), ORDER.pt);
  }
  edgeSegs = segs; vertexPts = pts;
  points.push(segs, fall, pts);
  return { box, points };
}

// ---- up axis ----
// STEP carries no "up": Y-up CADs (SolidWorks, Inventor, Creo) and Z-up ones (CATIA,
// NX, Onshape, FreeCAD) write the same kind of file. Each load starts at what its source
// says — ?up= for a file named in the address, Y for one opened or dropped here — and is
// not remembered, since the next file may come from the other kind of CAD. The default
// view looks from the same height either way; only which axis is up changes.
const UP = {
  y: { up: new THREE.Vector3(0, 1, 0), forward: new THREE.Vector3(1, 0.8, 1) },
  z: { up: new THREE.Vector3(0, 0, 1), forward: new THREE.Vector3(1, -1, 0.8) },
};
let upAxis = 'y';
let lastFit = { box: new THREE.Box3(), points: [] };
const upParam = (new URLSearchParams(location.search).get('up') || '').toLowerCase() === 'z' ? 'z' : 'y';

function setUp(axis) {
  upAxis = axis;
  controls.dispose();
  camera.up.copy(UP[axis].up);
  controls = new OrbitControls(camera, renderer.domElement);
  fitCamera(lastFit);
  const btn = document.getElementById('up-btn');
  btn.textContent = axis.toUpperCase() + '\u2191';
  btn.setAttribute('aria-label', `Up axis: ${axis.toUpperCase()}`);
  for (const b of document.querySelectorAll('#up-menu button')) {
    b.setAttribute('aria-checked', String(b.dataset.up === axis));
  }
}
function openUpMenu(on) {
  document.getElementById('up-menu').hidden = !on;
  document.getElementById('up-btn').setAttribute('aria-expanded', String(on));
}
document.getElementById('up-btn').addEventListener('click', () =>
  openUpMenu(document.getElementById('up-menu').hidden));
for (const b of document.querySelectorAll('#up-menu button')) {
  b.addEventListener('click', () => { openUpMenu(false); setUp(b.dataset.up); });
}
// Ways out without choosing: a press anywhere else, or Escape.
document.addEventListener('pointerdown', (e) => {
  if (!document.getElementById('up').contains(e.target)) openUpMenu(false);
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') openUpMenu(false); });

function fitCamera(fit) {
  lastFit = fit;
  const { box, points } = fit;
  if (box.isEmpty()) return;
  // Rotate around the AABB centre, and pull the camera in to the closest
  // distance at which every drawn point still sits inside the middle 90% of the
  // view (a 5% margin at each edge, respecting the viewport aspect).
  const c = box.getCenter(new THREE.Vector3());
  controls.target.copy(c);

  const { up: worldUp, forward: dir } = UP[upAxis];
  const forward = dir.clone().normalize();   // target → camera
  const right = new THREE.Vector3().crossVectors(worldUp, forward).normalize();
  const up = new THREE.Vector3().crossVectors(forward, right).normalize();
  const tanV = Math.tan((camera.fov * Math.PI / 180) / 2) * 0.9;
  const tanH = tanV * camera.aspect;

  let dist = 0, front = 0;
  for (const d of points) {
    for (let i = 0; i < d.length; i += 3) {
      const px = d[i] - c.x, py = d[i + 1] - c.y, pz = d[i + 2] - c.z;
      const x = px * right.x + py * right.y + pz * right.z;
      const y = px * up.x + py * up.y + pz * up.z;
      const z = px * forward.x + py * forward.y + pz * forward.z;
      dist = Math.max(dist, z + Math.abs(x) / tanH, z + Math.abs(y) / tanV);
      front = Math.max(front, z);
    }
  }
  const size = box.getSize(new THREE.Vector3()).length() || 1;
  // Stay clear of the nearest point, past the near plane set below.
  dist = Math.max(dist, front + size / 50);

  camera.position.copy(c).add(forward.multiplyScalar(dist));
  camera.near = size / 100; camera.far = size * 1000; camera.updateProjectionMatrix();
  controls.update();
}

// gather geom ids inside a tree node subtree
function collectIds(node, out) {
  if (ranges.has(node.id)) out.add(node.id);
  for (const c of (node.children || [])) collectIds(c, out);
}

// Copy the given runs of `src` (in units of `size` floats) into one array,
// merging runs that sit next to each other into one copy.
function gatherRuns(src, runs, size) {
  runs.sort((a, b) => a[0] - b[0]);
  let total = 0;
  for (const [, n] of runs) total += n;
  const out = new Float32Array(total * size);
  let at = 0;
  for (let i = 0; i < runs.length;) {
    let [start, n] = runs[i++];
    while (i < runs.length && runs[i][0] === start + n) n += runs[i++][1];
    out.set(src.subarray(start * size, (start + n) * size), at);
    at += n * size;
  }
  return out;
}

function selectNode(node) {
  if (node === hiNode) return;
  clearHighlight();
  hiNode = node;
  const ids = new Set(); collectIds(node, ids);
  // Features/PMI reference geometry indirectly; HLMAP lists the render ids to
  // light up (edge lines / vertex points of the referenced faces & edges).
  const hl = HLMAP[node.id] || [];
  hl.forEach(i => ids.add(i));
  const hlSet = new Set(hl);
  const segRuns = [], ptRuns = [];
  for (const id of ids) {
    const r = ranges.get(id);
    if (!r || r.fallback) continue;        // fallback keeps its red dashed look
    if (r.type === 'line') {
      if (r.count) segRuns.push([r.start, r.count]);
    } else if (r.type === 'point') {
      // Points highlight only when the vertex itself is the selected node or is
      // referenced via HLMAP; selecting a solid/face lights up its edges, not
      // their endpoint points.
      if (id === node.id || hlSet.has(id)) ptRuns.push([r.start, 1]);
    } else {
      r.obj.material = M.hiMesh;
      hiMeshes.push(r.obj);
    }
  }
  if (segRuns.length) {
    const geo = new LineSegmentsGeometry();
    geo.setPositions(gatherRuns(edgeSegs, segRuns, 6));
    const obj = new LineSegments2(geo, M.hiLine);
    obj.renderOrder = ORDER.hiLine;
    hiObjs.push(obj);
  }
  if (ptRuns.length) {
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(gatherRuns(vertexPts, ptRuns, 3), 3));
    const obj = new THREE.Points(geo, M.hiPt);
    obj.renderOrder = ORDER.hiPt;
    hiObjs.push(obj);
  }
  for (const o of hiObjs) root.add(o);
}

function clearHighlight() {
  for (const o of hiObjs) { root.remove(o); o.geometry.dispose(); }
  for (const m of hiMeshes) m.material = M.mesh;
  hiNode = null; hiObjs = []; hiMeshes = [];
}

// ---- tree build (native <details>/<summary>) ----
// The whole row is the toggle target; a click also drives the 3D highlight.
// Children are built lazily on a <details>'s first open (glitch-free: native
// owns the open/closed state, we only fill once).
function esc(s) {
  return String(s).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
}

let selRow = null;  // selected .row element (sticky single selection)
let selNode = null; // selected node — drives the 3D highlight when not hovering
function selectRow(rowEl, node) {
  if (selRow) selRow.classList.remove('sel');
  selRow = rowEl; rowEl.classList.add('sel');
  selNode = node;
  selectNode(node);
  showDetail(node);
}
function deselect() {
  if (selRow) selRow.classList.remove('sel');
  selRow = null; selNode = null;
  clearHighlight();
  clearDetail();
}
// Hover previews an item's geometry in the 3D view; leaving the tree reverts to
// the selected item (or nothing). Selection (click) and detail are unaffected.
function hoverNode(node) { selectNode(node); }
function unhover() { if (selNode) selectNode(selNode); else clearHighlight(); }

// Build the inner content of a row: [chevron][dot][label #id]. Attributes live
// in the detail pane, not inline, so scene rows stay a single scannable line.
function rowInner(node, { chevron }) {
  const chev = `<span class="chev${chevron ? '' : ' leaf'}"></span>`;
  const emptyGroup = node.kind === 'Group' && !(node.children && node.children.length);
  const id = (node.kind === 'Group' || node.id == null) ? '' : `<span class="idtag">#${node.id}</span>`;
  const none = emptyGroup ? '<span class="none">(none)</span>' : '';
  return `${chev}<div class="node-content"><div class="node-title"><span class="dot"></span><span class="label">${esc(node.label)}</span>${id}${none}</div></div>`;
}

// ---- detail (inspector) pane ----
function detailValueHtml(k, v) {
  // a `color` value like "#c33240" gets a swatch chip before the hex text
  if (k === 'color' && /^#[0-9a-fA-F]{6}$/.test(v)) {
    return `<span class="swatch" style="background:${v}"></span>${esc(v)}`;
  }
  return esc(v);
}
function clearDetail() {
  document.getElementById('detail').innerHTML =
    '<div class="detail-empty">Select an item to see details</div>';
}
function showDetail(node) {
  const el = document.getElementById('detail');
  const kidCount = node.children ? node.children.length : 0;
  const id = (node.kind === 'Group' || node.id == null) ? '' : `<span class="idtag">#${node.id}</span>`;
  let html = `<div class="detail-title"><span class="label">${esc(node.label)}</span>`
    + `<span class="kind">${esc(node.kind)}</span>${id}</div>`;
  if (node.meta && node.meta.length) {
    html += node.meta.map(([k, v]) =>
      `<div class="detail-row"><span class="mk">${esc(k)}</span><span class="mv">${detailValueHtml(k, v)}</span></div>`).join('');
  } else if (node.kind === 'Group') {
    html += `<div class="detail-empty">${kidCount} item${kidCount === 1 ? '' : 's'}</div>`;
  } else {
    html += '<div class="detail-empty">(no attributes)</div>';
  }
  el.innerHTML = html;
}

function rowClass(node) {
  let c = 'row k-' + node.kind;
  if (node.kind === 'Group') {
    c += ' group';
    if (!(node.children && node.children.length)) c += ' empty';
  }
  return c;
}

// Create one tree node element at `depth`. Parents become <details> (filled on
// first open); leaves become a plain clickable row.
function renderNode(node, depth) {
  const pad = `padding-left:${4 + depth * 14}px`;
  const hasKids = node.children && node.children.length;
  if (hasKids) {
    const det = document.createElement('details');
    const sum = document.createElement('summary');
    sum.className = rowClass(node);
    sum.setAttribute('style', pad);
    sum.innerHTML = rowInner(node, { chevron: true });
    det.appendChild(sum);
    let filled = false;
    det.addEventListener('toggle', () => {
      if (det.open && !filled) {
        filled = true;
        for (const c of node.children) det.appendChild(renderNode(c, depth + 1));
      }
    });
    sum.addEventListener('click', () => selectRow(sum, node));
    sum.addEventListener('mouseenter', () => hoverNode(node));
    return det;
  }
  const row = document.createElement('div');
  row.className = rowClass(node);
  row.setAttribute('style', pad);
  row.innerHTML = rowInner(node, { chevron: false });
  if (!(node.kind === 'Group')) {
    row.addEventListener('click', () => selectRow(row, node));
    row.addEventListener('mouseenter', () => hoverNode(node));
  }
  return row;
}

// The reader sends each node once, children before their parent: `children`
// hold node ids (>= 0) and group references (-1 - index into `groups`). Put the
// objects in their place, so a node under several parents is one shared object.
function linkTree(out) {
  const list = out.nodes || [], groups = out.groups || [], nodes = [];
  for (const n of list) nodes[n.id] = n;
  const ref = (c) => (c >= 0 ? nodes[c] : groups[-1 - c]);
  for (const n of list) if (n.children) n.children = n.children.map(ref);
  for (const g of groups) if (g.children) g.children = g.children.map(ref);
  return (out.tree || []).map(ref);
}

function buildTree(roots) {
  selRow = null; selNode = null;
  const frag = document.createDocumentFragment();
  for (const r of roots) frag.appendChild(renderNode(r, 0));
  return frag;
}

// Leaving the tree area drops the hover preview back to the selection; a click on
// empty sidebar space (not on any row) deselects.
document.getElementById('tree').addEventListener('mouseleave', unhover);
document.getElementById('side-scroll').addEventListener('click', (e) => {
  if (!e.target.closest('.row')) deselect();
});

// ---- report / header panels (same native primitives, read-only) ----
// These are info panels: rows expand/collapse but never select or touch the 3D
// view (no click->selectNode handler; `.info` styling shows a default cursor).
const metaPad = (depth) => `padding-left:${4 + depth * 14}px`;

// A collapsible info section (closed by default). Append children to it.
function infoSection(cls, label, depth) {
  const det = document.createElement('details');
  const sum = document.createElement('summary');
  sum.className = `row info ${cls}`;
  sum.setAttribute('style', metaPad(depth));
  sum.innerHTML = `<span class="chev"></span><div class="node-content"><div class="node-title"><span class="label">${esc(label)}</span></div></div>`;
  det.appendChild(sum);
  return det;
}
function kvRow(k, v, depth) {
  const row = document.createElement('div');
  row.className = 'row info kv';
  row.setAttribute('style', metaPad(depth));
  // An empty value renders as a muted em-dash, so "absent in the file" reads
  // differently from "not shown".
  const mv = v ? `<span class="mv">${esc(v)}</span>` : `<span class="mv empty">—</span>`;
  row.innerHTML = `<span class="chev leaf"></span><div class="node-content"><div class="metaline"><span class="mk">${esc(k)}</span>${mv}</div></div>`;
  return row;
}
function textRow(s, depth) {
  const row = document.createElement('div');
  row.className = 'row info kv';
  row.setAttribute('style', metaPad(depth));
  row.innerHTML = `<span class="chev leaf"></span><div class="node-content"><div class="metaline"><span class="mv">${esc(s)}</span></div></div>`;
  return row;
}
// A nested "title (n)" section listing up to CAP rendered items.
function subSection(title, items, depth, render) {
  const CAP = 500;
  // Empty: a muted, non-expandable row showing "(0)" so the category is always
  // visible (0 vs. hidden reads unambiguously).
  if (!items.length) {
    const row = document.createElement('div');
    row.className = 'row info meta-sub empty';
    row.setAttribute('style', metaPad(depth));
    row.innerHTML = `<span class="chev leaf"></span><div class="node-content"><div class="node-title"><span class="label">${esc(title)} (0)</span></div></div>`;
    return row;
  }
  const sec = infoSection('meta-sub', `${title} (${items.length})`, depth);
  items.slice(0, CAP).forEach(x => sec.appendChild(render(x, depth + 1)));
  if (items.length > CAP) sec.appendChild(textRow(`… ${items.length - CAP} more`, depth + 1));
  return sec;
}

function showReport(r, warnings) {
  const el = document.getElementById('report');
  el.innerHTML = '';
  if (!r) return;
  const drops = r.dropped;
  const root = infoSection('meta-root', 'Report', 0);
  // Provenance counts, one per line. `dropped` is not repeated here — its count
  // shows in the "dropped (N)" section title below.
  root.appendChild(kvRow('input', String(r.n_in), 1));
  root.appendChild(kvRow('kept', String(r.validated), 1));
  root.appendChild(kvRow('synthesized', String(r.n_synth), 1));
  // Always show every category (empty ones render as "(0)").
  root.appendChild(subSection('dropped', drops, 1, ([id, why], d) => kvRow('#' + id, why, d)));
  root.appendChild(subSection('normalized', r.norm, 1, ([id, note], d) => kvRow('#' + id, note, d)));
  root.appendChild(subSection('parse warnings', r.parse_warnings, 1, (s, d) => textRow(s, d)));
  root.appendChild(subSection('warnings', warnings, 1, (s, d) => textRow(s, d)));
  el.appendChild(root);
}
function showUnits(units) {
  const el = document.getElementById('units');
  el.innerHTML = '';
  if (!units || !units.length) return;
  const root = infoSection('meta-root', 'Units', 0);
  for (const [k, v] of units) root.appendChild(kvRow(k, v, 1));
  el.appendChild(root);
}
function showHeader(h) {
  const el = document.getElementById('header');
  el.innerHTML = '';
  const root = infoSection('meta-root', 'Header', 0);
  // Every header field is always shown — an absent one renders empty (—) so it's
  // clear the file lacks it, rather than the viewer hiding it.
  const add = (k, v) => {
    const val = Array.isArray(v) ? v.join(', ') : (v || '');
    root.appendChild(kvRow(k, val, 1));
  };
  add('file', h.file_name);
  add('schema', h.schema); add('schema(raw)', h.raw_schema);
  add('description', h.description);
  add('author', h.author); add('organization', h.organization); add('timestamp', h.time_stamp);
  add('originating system', h.originating_system);
  add('preprocessor', h.preprocessor); add('authorisation', h.authorisation);
  el.appendChild(root);
}

// ---- load ----
async function loadBlob(blob, up = 'y') {
  // The last file stays on screen while this one is read.
  const drop = document.getElementById('drop');
  drop.textContent = 'Reading …';
  drop.style.display = '';
  let out, geom = [];
  try {
    const read = await readStep(blob);
    if (read === CANCELLED) return; // a newer file took over
    out = JSON.parse(read.json);
    geom = read.geom;
  } catch (e) {
    out = { ok: false, error: `read failed: ${e.message}` };
  }
  const upEl = document.getElementById('up');
  upEl.hidden = true;
  openUpMenu(false);
  showHeader(out.header || {});
  showReport(out.report, out.warnings || []);
  showUnits(out.units || []);
  const tree = document.getElementById('tree');
  tree.innerHTML = '';
  selRow = null; selNode = null; clearDetail(); // drop lingering selection from the last file
  clearScene();
  if (!out.ok) {
    tree.innerHTML = `<pre style="color:#c00">${esc(out.error || 'read failed')}</pre>`;
    drop.textContent = 'Drop a STEP file here';
    return;
  }
  HLMAP = out.hl || {};
  lastFit = buildObjects(geom);
  setUp(up);
  upEl.hidden = false;
  tree.appendChild(buildTree(linkTree(out)));
  drop.style.display = 'none';
}

// ---- file input + drag/drop (both paths sync the displayed filename) ----
function loadFile(f) {
  if (!f) return;
  const fn = document.getElementById('fname');
  fn.textContent = f.name;
  fn.title = f.name; // full name on hover, since the display truncates
  loadBlob(f);
}
document.getElementById('openbtn').addEventListener('click', () => document.getElementById('file').click());
document.getElementById('file').addEventListener('change', (e) => loadFile(e.target.files[0]));
const dz = document.getElementById('view');
dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('drop-hi'); });
dz.addEventListener('dragleave', () => dz.classList.remove('drop-hi'));
dz.addEventListener('drop', (e) => {
  e.preventDefault(); dz.classList.remove('drop-hi');
  loadFile(e.dataTransfer.files[0]);
});

// ---- optional auto-open from ?file=<url> ----
// The STEP data is never embedded in this HTML; instead a URL query param points
// at an external file (relative to the page or absolute) that is fetched on load.
// Requires the page to be served over http(s): browsers block fetch under file://.
async function loadUrl(url, up) {
  const fn = document.getElementById('fname');
  const drop = document.getElementById('drop');
  let name = url;
  try { name = decodeURIComponent(new URL(url, location.href).pathname.split('/').pop()) || url; } catch (_) {}
  fn.textContent = name; fn.title = url;
  drop.textContent = 'Loading …';
  try {
    const resp = await fetch(url);
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    await loadBlob(await resp.blob(), up);
  } catch (e) {
    fn.textContent = 'No file loaded';
    drop.textContent = 'Drop a STEP file here';
    document.getElementById('tree').innerHTML =
      `<pre style="color:#c00">Could not load ?file= URL:\n${esc(url)}\n${esc(String(e))}</pre>`;
  }
}

// ---- optional hand-over from ?from=<id> ----
// A page on this same origin (nacre-playground's "Open in step-loupe") hands a STEP
// over without a URL to fetch. The contract, owned here as its reader:
//   - The writer stores JSON {name, text, at} (at = epoch ms) in localStorage under
//     "step-loupe:<id>", then opens this page with ?from=<id>.
//   - The prefix is added here, never read from the URL. This page deletes what it
//     reads, so a bare key would let a link delete any other entry on the origin.
//   - The first read moves the entry into this tab's sessionStorage: a reload or a
//     duplicated tab opens it again, and closing the tab clears it.
//   - Every load sweeps entries older than ten minutes, or unreadable ones: a tab the
//     browser blocked, or one closed before it loaded, leaves its entry behind.
// Only pages on this origin share the storage, so the downloaded bundle and pages on other
// hosts cannot hand anything over.
const HANDOFF = 'step-loupe:';
const HANDOFF_TTL_MS = 10 * 60 * 1000;

function takeHandoff(id) {
  const key = HANDOFF + id;
  const kept = sessionStorage.getItem(key);
  if (kept !== null) return JSON.parse(kept);
  const raw = localStorage.getItem(key);
  if (raw === null) return null;
  localStorage.removeItem(key);
  // Too big for this tab's storage: this load still has it, a reload will not.
  try { sessionStorage.setItem(key, raw); } catch (_) {}
  return JSON.parse(raw);
}

function sweepHandoffs() {
  const now = Date.now();
  const keys = [];
  for (let i = 0; i < localStorage.length; i++) {
    const key = localStorage.key(i);
    if (key && key.startsWith(HANDOFF)) keys.push(key);
  }
  for (const key of keys) {
    let at = NaN;
    try { at = JSON.parse(localStorage.getItem(key)).at; } catch (_) {}
    if (!(now - at < HANDOFF_TTL_MS)) localStorage.removeItem(key);
  }
}

async function loadHandoff(id, up) {
  let entry = null, failure = null;
  try { entry = takeHandoff(id); } catch (e) { failure = e; }
  if (!entry || typeof entry.text !== 'string') {
    const why = failure ? String(failure)
      : 'nothing was handed over under this key — open it again from the app';
    document.getElementById('tree').innerHTML =
      `<pre style="color:#c00">Could not load ?from= hand-over:\n${esc(id)}\n${esc(why)}</pre>`;
    return;
  }
  const fn = document.getElementById('fname');
  const name = typeof entry.name === 'string' && entry.name ? entry.name : 'handed-over.step';
  fn.textContent = name; fn.title = name;
  await loadBlob(new Blob([entry.text]), up);
}

const params = new URLSearchParams(location.search);
const fromParam = params.get('from');
const fileParam = params.get('file');
if (fromParam) loadHandoff(fromParam, upParam);
else if (fileParam) loadUrl(fileParam, upParam);
// After the hand-over is taken (synchronously, before loadHandoff's first await), so a
// slow load never sweeps the entry it came for.
try { sweepHandoffs(); } catch (_) {}
</script>
</body>
</html>
